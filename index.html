<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marko Duda — Projects</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0c0b0a;
            --text: #e9e2d0;
            --text-muted: #bdb6a6;
            --line: #3a3631;
            --accent: #c79b3e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            background: var(--bg);
            color: var(--text);
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 4rem 1rem;
            font-family: 'EB Garamond', serif;
            -webkit-font-smoothing: antialiased;
        }

        .label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        main {
            width: 100%;
            max-width: 420px;
        }

        header {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 4rem;
        }

        h1 {
            font-size: 22px;
            font-style: italic;
            font-weight: 400;
        }

        section + section {
            margin-top: 2.5rem;
        }

        section .label {
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--line);
        }

        ul {
            list-style: none;
        }

        a {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0.9rem 0;
            border-bottom: 1px solid var(--line);
            color: var(--text);
            text-decoration: none;
            font-size: 22px;
            font-style: italic;
            transition: color 0.2s ease;
        }

        a span {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        a small {
            font-style: normal;
        }

        a::after {
            content: '→';
            font-family: 'IBM Plex Mono', monospace;
            font-style: normal;
            font-size: 13px;
            color: var(--text-muted);
            transition: color 0.2s ease, transform 0.2s ease;
        }

        a:hover,
        a:focus-visible {
            color: var(--accent);
            outline: none;
        }

        a:hover::after,
        a:focus-visible::after {
            color: var(--accent);
            transform: translateX(4px);
        }

        .profiles {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1.5rem;
            margin-top: 1rem;
        }

        .profiles a {
            padding: 0;
            border-bottom: none;
            gap: 6px;
            color: var(--text-muted);
        }

        .profiles a::after {
            content: '↗';
            font-size: 11px;
        }

        .profiles a:hover,
        .profiles a:focus-visible {
            color: var(--accent);
        }

        .profiles a:hover::after,
        .profiles a:focus-visible::after {
            transform: translate(2px, -2px);
        }
    </style>
</head>
<body>
<main>
    <header>
        <h1>Marko Duda</h1>
        <div class="label">Projects</div>
        <nav class="profiles">
            <a href="https://github.com/markoduda/" class="label" target="_blank" rel="noopener">My GitHub</a>
            <a href="https://scholar.google.com/citations?user=zh_7stsAAAAJ&amp;hl=en" class="label" target="_blank" rel="noopener">My Google Scholar</a>
        </nav>
    </header>

    <section>
        <div class="label">Work</div>
        <ul>
            <li><a href="vision2music.html"><span>Vision2Music<small class="label">Research Project</small></span></a></li>
        </ul>
    </section>

    <section>
        <div class="label">Hobby</div>
        <ul>
            <li><a href="Altarpiece_no_1.html"><span>Hilma af Klint - Interactive<small class="label">Design Project</small></span></a></li>
        </ul>
    </section>
</main>
</body>
</html>
